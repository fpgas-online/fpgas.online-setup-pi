# fpgas-online-setup-pi: USB gadget serial console (70-fpgas-usb-console.rules).
# Two CDC-ACM ports: ttyGS0 carries the kernel log, ttyGS1 a login getty.
# The host sees them as two /dev/ttyACM* devices (0525:a4a7 "Gadget Serial").
options g_serial n_ports=2 iManufacturer=fpgas.online iProduct=usb-console
