name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: uv run --with pytest pytest tests/ -v
  fleet-mqtt:
    # The fleet scripts against a real broker and each paho-mqtt the Pi roots
    # ship: bookworm 1.6.1 has no CallbackAPIVersion, trixie has 2.x.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        paho: ["1.6.1", "2.1.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install mosquitto
        run: sudo apt-get install -y mosquitto
      - name: DIAGNOSTIC (issue 24, remove before merge)
        run: |
          set -x
          sudo apt-get install -y strace || true
          cat /etc/os-release || true
          mosquitto -h | head -3 || true
          command -v mosquitto || true
          ls -l "$(command -v mosquitto || echo /usr/sbin/mosquitto)" || true
          id
          sudo aa-status || true
          ls -l /etc/apparmor.d/ || true
          ls -l /etc/apparmor.d/*mosquitto* || true
          cat /etc/apparmor.d/*mosquitto* || true
          uv run --with pytest python -c "print('dummy')"
          mkdir -p tests_dummy && printf 'def test_x(tmp_path):\n    assert tmp_path.exists()\n' > tests_dummy/test_dummy.py
          uv run --with pytest pytest tests_dummy -q -p no:cacheprovider || true
          ls -ld /tmp /tmp/pytest-of-runner /tmp/pytest-of-runner/* || true
          D=$(mktemp -d /tmp/pytest-of-runner/diag.XXXX) || D=$(mktemp -d)
          ls -ld "$D"
          printf 'listener 18831 127.0.0.1\nallow_anonymous true\n' > "$D/m.conf"
          ls -l "$D/m.conf"
          timeout 3 mosquitto -v -c "$D/m.conf"; echo "rc tmp-pytest=$?"
          T=$(mktemp -d)
          cp "$D/m.conf" "$T/m.conf"; ls -ld "$T"
          timeout 3 mosquitto -v -c "$T/m.conf"; echo "rc tmp-mktemp=$?"
          timeout 3 mosquitto -v -c /tmp/../tmp/$(basename "$T")/m.conf; echo "rc tmp-dotdot=$?"
          cp "$D/m.conf" "$GITHUB_WORKSPACE/m.conf"
          timeout 3 mosquitto -v -c "$GITHUB_WORKSPACE/m.conf"; echo "rc workspace=$?"
          timeout 3 mosquitto -v -p 18832; echo "rc port-only=$?"
          timeout 3 strace -f -e trace=openat,open,stat,newfstatat,statx mosquitto -v -c "$T/m.conf" || echo "strace rc=$?"
          sudo dmesg | grep -i -E 'apparmor|mosquitto' || true
          sudo journalctl -k --no-pager | grep -i -E 'apparmor|mosquitto' || true
      - name: Run the fleet MQTT tests on paho-mqtt ${{ matrix.paho }}
        env:
          FLEET_MQTT_REQUIRED: "1"
        run: >-
          uv run --with pytest --with paho-mqtt==${{ matrix.paho }}
          pytest tests/test_fleet_mqtt.py tests/test_fleet_agent.py -v
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck --severity=warning || true
